<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120d20">
  <meta name="description" content="Tem um presente esperando por você. Clique para continuar.">
  <meta property="og:title" content="Um presente para você">
  <meta property="og:description" content="Toque no presente para continuar.">
  <title>Um presente para você</title>
  <style>
    :root { color-scheme: dark; --bg:#120d20; --pink:#ff4f9a; --gold:#ffd782; --text:#fff8fc; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100svh; display:grid; place-items:center; padding:24px;
      color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: radial-gradient(ellipse at 50% 20%, #48204d 0%, #21132f 38%, var(--bg) 78%);
    }
    main { width:min(100%, 440px); text-align:center; }
    .eyebrow { color:var(--gold); text-transform:uppercase; letter-spacing:.18em; font-size:.75rem; font-weight:800; }
    h1 { margin:12px 0 10px; font-size:clamp(2rem,8vw,3rem); line-height:1.05; letter-spacing:-.04em; }
    .sub { margin:0 auto 26px; color:#e5d9e8; line-height:1.6; max-width:32ch; }
    .gift-link {
      display:grid; place-items:center; margin:0 auto 22px; width:172px; height:172px;
      border:1px solid rgba(255,255,255,.24); border-radius:36px; text-decoration:none;
      background:linear-gradient(145deg,rgba(255,79,154,.24),rgba(255,215,130,.10));
      box-shadow:0 20px 70px rgba(255,79,154,.20), inset 0 1px 0 rgba(255,255,255,.16);
      transition:transform .18s ease, box-shadow .18s ease; animation:float 3s ease-in-out infinite;
    }
    .gift-link:hover { transform:translateY(-4px) scale(1.025); box-shadow:0 24px 80px rgba(255,79,154,.30); }
    .gift-link:focus-visible, .cta:focus-visible { outline:3px solid var(--gold); outline-offset:5px; }
    .gift { font-size:5.6rem; filter:drop-shadow(0 8px 16px rgba(0,0,0,.22)); }
    .cta {
      display:block; width:100%; padding:16px 20px; border-radius:15px; color:#25111f;
      background:linear-gradient(100deg,#ff77b1,var(--gold)); font-weight:850; font-size:1rem;
      text-decoration:none; box-shadow:0 12px 30px rgba(255,79,154,.16);
    }
    .destination { margin:18px 0 0; color:#cdbdd2; font-size:.8rem; line-height:1.5; overflow-wrap:anywhere; }
    .destination strong { color:#fff; }
    .note { margin:14px 0 0; color:#a999b0; font-size:.74rem; }
    @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-7px) } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Uma surpresa especial</div>
    <h1>Tem um presente<br>para você 🎁</h1>
    <p class="sub">Toque no presente abaixo para continuar.</p>
    <a class="gift-link" href="https://www.crownbot.com.br/natyvampirinha"
       aria-label="Abrir o destino do presente" rel="noopener noreferrer">
      <span class="gift" aria-hidden="true">🎁</span>
    </a>
    <a class="cta" href="https://www.crownbot.com.br/natyvampirinha" rel="noopener noreferrer">
      ABRIR MEU PRESENTE
    </a>
  </main>
</body>
</html>
